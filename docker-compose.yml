services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: empleados_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Se ejecuta solo la primera vez (volumen vacío)
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d empleados_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DB_DSN: "host=dpg-db8fe4l9fdbs739d0flg-a.oregon-postgres.render.com port=5432 dbname=postgresql_p9vb user=admin password=1GYO44KyGugWzFxIBeS1H5aQQNcW35Oi sslmode=require"

    ports:
      - "8091:8091"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
